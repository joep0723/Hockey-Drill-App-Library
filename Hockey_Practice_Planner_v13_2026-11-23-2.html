<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hockey Practice Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='5' width='30' height='22' rx='9' fill='%23e8f4fc' stroke='%230b63ce' stroke-width='2'/%3E%3Cline x1='16' y1='5' x2='16' y2='27' stroke='%23D55E00' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#e9eef4; --panel:#ffffff; --panel2:#f4f7fa; --line:#d3dce6; --text:#17212b; --muted:#5b6a79;
  --accent:#0b63ce; --accent-soft:#e1eeff; --accent-ink:#ffffff; --danger:#c62828; --warn:#b45309; --stage:#dfe7ef;
  --shadow:0 1px 2px rgba(15,30,50,.08),0 2px 8px rgba(15,30,50,.06);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e141b; --panel:#17202a; --panel2:#1e2935; --line:#2c3a4a; --text:#e6edf5; --muted:#92a3b5; --accent:#4c9dff; --accent-soft:#17365a; --accent-ink:#06121f; --danger:#ff7b7b; --warn:#f0b35a; --stage:#101821; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)}
#app{display:grid;grid-template-columns:var(--lw,276px) minmax(0,1fr) var(--rw,360px);grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
#left{grid-column:1;grid-row:2} #center{grid-column:2;grid-row:2} #right{grid-column:3;grid-row:2}
#app.noleft{--lw:0px} #app.noleft #left{display:none}
#app.noright{--rw:0px} #app.noright #right{display:none}

/* top bar (two rows) */
#topbar{grid-column:1/-1;display:flex;flex-direction:column;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:3}
.tb-row{display:flex;align-items:center;gap:8px;padding:6px 12px;flex-wrap:wrap}
.tb-row.r2{padding-top:0;padding-bottom:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand svg{width:26px;height:26px}
.fld{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 9px}
.fld:focus{outline:2px solid var(--accent);background:var(--panel)}
.w-plan{flex:1 1 200px;max-width:320px;font-weight:600} .w-team{flex:1 1 140px;max-width:220px} .w-date{flex:0 0 150px}
.spacer{flex:1}
.grp{display:flex;gap:5px;align-items:center;padding-left:8px;border-left:1px solid var(--line)}
.tb-row .grp:first-child{border-left:0;padding-left:0}
#topbar button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 10px;white-space:nowrap}
#topbar button:hover{border-color:var(--accent)}
#topbar button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
#topbar button:disabled{opacity:.4;cursor:default}
#bSave.dirty::after{content:" ●";color:#ffd166}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer}
#saveState{font-size:11.5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* left tool panel */
#left{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:8px 8px 20px}
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.sec-h{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:0;border-radius:10px;padding:8px 10px;font-weight:700;text-align:left}
.sec.open .sec-h{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:1px solid var(--line)}
.sec-h .car{transition:transform .15s;color:var(--muted)} .sec.open .car{transform:rotate(90deg)}
.sec-b{display:none;padding:8px} .sec.open .sec-b{display:block}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:8px 2px 5px;font-weight:700}
.sub:first-child{margin-top:0}
.grid{display:grid;gap:6px} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:4px 2px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:11px;line-height:1.1;text-align:center}
.tool svg{width:100%;height:30px;display:block;pointer-events:none}
.tool:hover{border-color:var(--accent);background:var(--accent-soft)}
.tool.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.tool.selecttool{flex-direction:row;gap:8px;min-height:38px;font-size:13px;font-weight:600;width:100%;margin-bottom:8px}
.tool.selecttool svg{width:22px;height:22px}
.people .tool{min-height:46px} .people .tool svg{height:32px}
.team{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.team button,.swb{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.team button.on,.swb.on{box-shadow:0 0 0 2px var(--accent)}
.team input[type=color]{width:26px;height:24px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.lay-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:10.5px;line-height:1.1;text-align:center}
.lay-btn svg{width:100%;height:auto;display:block}
.lay-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.lay-btn.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px}
.btn:hover{border-color:var(--accent)}
.btn.danger{color:var(--danger)} .btn.sm{padding:3px 8px;font-size:12px} .btn.wide{width:100%}
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 8px;width:100%}
textarea{resize:vertical;min-height:70px}
.saved-lay{display:flex;gap:4px;align-items:center;margin:4px 0}
.saved-lay button.n{flex:1;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* center */
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#inspector{display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:6px 12px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-height:88px;font-size:13px}
.insp-hint{color:var(--muted)}
.insp-title{font-weight:700;padding:3px 9px;background:var(--accent-soft);border-radius:999px;white-space:nowrap}
#inspector label{display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
#inspector input[type=range]{width:84px;accent-color:var(--accent)}
#inspector select{width:auto;padding:3px 6px}
#inspector input[type=number]{width:64px;padding:3px 6px}
#inspector input[type=text]{width:90px;padding:3px 6px}
#inspector output{min-width:30px;color:var(--text);font-variant-numeric:tabular-nums}
.sw{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.sw .swb{width:18px;height:18px}
.sw input[type=color]{width:26px;height:24px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.tg,.ibtn{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:3px 9px;min-width:30px}
.tg.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ibtn:hover{border-color:var(--accent)} .ibtn.danger{color:var(--danger)}
.insp-sep{width:1px;height:22px;background:var(--line)}
#stageWrap{position:relative;flex:1;min-height:0;background:var(--stage);overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#stage.t-select{cursor:default} #stage.t-select [data-id]{cursor:move} #stage:not(.t-select){cursor:crosshair}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(15,25,38,.88);color:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;pointer-events:none;display:none;max-width:92%;text-align:center;z-index:2}
#hint.show{display:flex;gap:10px;align-items:center}
#hint button{pointer-events:auto;border:0;background:#fff;color:#0b2540;border-radius:999px;padding:2px 10px;font-weight:700}
#textEditor{position:absolute;z-index:4;border:2px solid var(--accent);border-radius:4px;resize:none;overflow:hidden;font-family:Arial,Helvetica,sans-serif;margin:0;outline:none;min-height:0;background:#fff;color:#111}
#tabbar{display:flex;align-items:stretch;gap:8px;background:var(--panel);border-top:1px solid var(--line);padding:6px 10px}
#tabs{display:flex;gap:4px;overflow-x:auto;flex:1;align-items:stretch;padding-bottom:2px}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-bottom-width:3px;background:var(--panel2);border-radius:8px 8px 4px 4px;padding:4px 12px;max-width:210px;text-align:left;touch-action:pan-x;user-select:none}
.tab b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.tab small{color:var(--muted);font-size:11px;white-space:nowrap}
.tab.on{background:var(--panel);border-color:var(--accent)}
.tab.add{align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent);padding:2px 14px}
.tab.drag{opacity:.85;box-shadow:0 4px 14px rgba(0,0,0,.3);position:relative;z-index:6;cursor:grabbing}
.tab.dropbefore{box-shadow:-4px 0 0 var(--accent)} .tab.dropafter{box-shadow:4px 0 0 var(--accent)}
#tabStatus{font-size:12px;color:var(--muted);white-space:nowrap;align-self:center}
#tabStatus.warn{color:var(--warn);font-weight:600}
#sheetActs{display:flex;gap:4px;align-items:center}

/* right panel */
#right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rtabs{display:flex;border-bottom:1px solid var(--line)}
.rtabs button{flex:1;border:0;background:var(--panel2);padding:9px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.rtabs button.on{background:var(--panel);color:var(--text);border-bottom-color:var(--accent)}
#rLib,#rNotes{flex:1;min-height:0;overflow:auto;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;font-size:12.5px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.lib-tools{display:flex;gap:6px;margin-bottom:8px}
.drill{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel);overflow:hidden}
.drill-h{display:flex;gap:9px;padding:7px;cursor:pointer;align-items:center;width:100%;text-align:left;border:0;background:transparent}
.drill-h:hover{background:var(--panel2)}
.thumb{flex:0 0 108px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#fff}
.thumb svg{display:block;width:100%;height:auto}
.dh-t{font-weight:700;font-size:13px;line-height:1.2}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--accent-soft)}
.tag.k{background:var(--panel2);border:1px solid var(--line)}
.drill-b{padding:8px 10px 10px;border-top:1px solid var(--line)}
.drill-b .big{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;margin-bottom:8px}
.drill-b .big svg{display:block;width:100%;height:auto}
.drill-b h5{margin:8px 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.drill-b p{margin:0 0 4px;white-space:pre-wrap} .drill-b ul{margin:0;padding-left:18px} .drill-b li{margin:1px 0}
.place{border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0;background:var(--panel2)}
.place .row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
.place label.l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;min-width:64px}
.place select{flex:1;min-width:120px;padding:3px 6px}
.seg{display:flex;flex:1}
.seg button{flex:1;border:1px solid var(--line);background:var(--panel);padding:4px 4px;font-size:12px;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0} .seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);position:relative}
.place .chk{font-size:12px}
.drill-act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;padding:4px 2px;font-size:12px}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.35}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin:10px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px} .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tl{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.tl-row{display:grid;grid-template-columns:136px 1fr auto;gap:6px;width:100%;border:0;background:transparent;text-align:left;padding:5px 6px;border-radius:6px}
.tl-row:hover{background:var(--panel2)} .tl-row.on{background:var(--accent-soft)}
.tl-row small{color:var(--muted)}
.tl-flag{grid-column:1/-1;color:var(--warn);font-size:12px;font-weight:600;padding:0 6px 2px}
.empty{color:var(--muted);padding:14px 4px;text-align:center}
.legend-prev{border:1px dashed var(--line);border-radius:8px;padding:6px;background:#fff;min-height:30px}
.legend-prev svg{display:block;max-width:100%;height:auto}

/* modal + toast + help */
#modalRoot .back{position:fixed;inset:0;background:rgba(5,12,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);width:min(540px,100%);max-height:92vh;display:flex;flex-direction:column}
.modal.wide{width:min(980px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.modal-h button{border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal-b .row{margin:8px 0} .modal-b label.l{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.opt{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer} .opt input{margin-top:3px}
.imgres{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.imgcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.imgcard img{width:100%;display:block;background:#fff;max-height:420px;object-fit:contain}
.imgcard .ia{display:flex;gap:6px;padding:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#0f1f30;color:#fff;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.logo-prev{height:150px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--panel2);overflow:hidden}
.logo-prev img{max-width:100%;max-height:100%}
.help details{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--panel)}
.help summary{padding:8px 11px;font-weight:700;cursor:pointer}
.help .hb{padding:0 14px 10px} .help ul{margin:4px 0;padding-left:18px} .help li{margin:3px 0}
.help table{border-collapse:collapse;width:100%;font-size:13px} .help td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top} .help td:first-child{white-space:nowrap;width:42%}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel2);font:12px monospace}

/* print */
#printRoot{display:none}
.pp-page{page-break-after:always;break-after:page;color:#111;background:#fff;font-family:Arial,Helvetica,sans-serif}
.pp-page:last-child{page-break-after:auto;break-after:auto}
.pp-head{display:flex;justify-content:space-between;font-size:9.5pt;color:#444;border-bottom:1.5px solid #0b3a66;padding-bottom:3px;margin-bottom:6px}
.pp-head b{color:#0b3a66}
.pp-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.pp-title h2{margin:0;font-size:17pt;color:#0b2540}
.pp-time{font-size:10.5pt;color:#444;white-space:nowrap}
.pp-diag{border:1px solid #9fb2c6;border-radius:4px;overflow:hidden;background:#fff}
.pp-diag svg{display:block;width:auto;max-width:100%;height:auto;aspect-ratio:var(--ar,2.24);margin:0 auto}
.land .pp-diag svg{max-height:3.95in} .port .pp-diag svg{max-height:4.4in}
.pp-legend{margin-top:5px} .pp-legend svg{display:block;width:100%;height:auto;max-height:.8in}
.pp-notes{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:8px;font-size:10pt;line-height:1.35}
.port .pp-notes{grid-template-columns:1fr}
.pp-notes h4{margin:0 0 2px;font-size:8.5pt;text-transform:uppercase;letter-spacing:.6px;color:#0b3a66}
.pp-notes p{margin:0 0 6px;white-space:pre-wrap} .pp-notes ul{margin:0 0 6px;padding-left:16px}
.pp-sum h1{margin:0 0 2px;font-size:22pt;color:#0b2540}
.pp-sum .meta{color:#444;font-size:11pt;margin-bottom:10px}
.pp-sum table{width:100%;border-collapse:collapse;font-size:10.5pt;margin-top:6px}
.pp-sum th{background:#0b3a66;color:#fff;text-align:left;padding:5px 8px;font-weight:600}
.pp-sum td{border-bottom:1px solid #cfd8e3;padding:5px 8px;vertical-align:top}
.pp-sum h3{margin:12px 0 4px;font-size:10pt;text-transform:uppercase;letter-spacing:.6px;color:#0b3a66}
.pp-sum p{margin:0;white-space:pre-wrap;font-size:10.5pt}
.pp-flag{color:#b45309;font-weight:700;font-size:9.5pt}
.bw .pp-title h2,.bw .pp-head b,.bw .pp-notes h4,.bw .pp-sum h1,.bw .pp-sum h3{color:#000} .bw .pp-head{border-bottom-color:#000} .bw .pp-sum th{background:#333} .bw .pp-flag{color:#000}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  #app,#modalRoot,#toast{display:none!important}
  #printRoot{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (pointer:coarse){
  .tool{min-height:60px} .tab{padding:8px 14px} #topbar button,.btn,.chip,.ibtn,.tg{min-height:38px}
  .sw .swb,.team button{width:26px;height:26px} #inspector input[type=range]{width:110px}
}
@media (max-width:1560px){ .brand span{display:none} }
@media (max-width:1250px){ #app{--lw:236px;--rw:316px} .thumb{flex-basis:92px} }
@media (max-width:980px){ #app{--lw:0px;--rw:0px} #left,#right{position:fixed;top:96px;bottom:0;z-index:20;width:min(330px,92vw);box-shadow:var(--shadow)} #left{left:0} #right{right:0} #app.noleft #left,#app.noright #right{display:none} #app:not(.noleft) #left,#app:not(.noright) #right{display:flex} #left{display:block} }

/* zoom and pan controls */
#zoomBar{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow);z-index:3}
#zoomBar button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;min-width:34px;min-height:30px;padding:2px 9px;font-weight:600}
#zoomBar button:hover:not(:disabled){border-color:var(--accent)} #zoomBar button:disabled{opacity:.45;cursor:default}
#zoomBar button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#zPct{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
#stage.pan-mode,#stage.pan-mode [data-id],#stage.pan-mode [data-h]{cursor:grab!important} #stage.grabbing,#stage.grabbing *{cursor:grabbing!important}
@media (pointer:coarse){ #zoomBar button{min-height:40px;min-width:42px} }

.drill-b a{color:var(--accent);word-break:break-word}

.curvechk{margin:0 2px 8px;font-size:12.5px}

/* notes by area of the ice */
.area-box{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:6px 8px;margin:6px 0;background:var(--panel2)}
.area-h{display:flex;gap:6px;margin-bottom:4px} .area-h input{font-weight:700}
.area-box textarea{min-height:56px}

/* print: notes by area of the ice */
.pp-areas{margin-top:7px} .pp-areas h4,.pp-equip h4{margin:0 0 3px;font-size:8.5pt;text-transform:uppercase;letter-spacing:.6px;color:#0b3a66}
.pp-band{display:grid;gap:10px;margin-bottom:5px} .port .pp-band{grid-template-columns:1fr!important}
.pp-area{border-top:3px solid var(--c,#0b3a66);padding-top:2px;font-size:9.5pt;line-height:1.3} .pp-area b{display:block;font-size:8.5pt;letter-spacing:.5px;text-transform:uppercase;color:var(--c,#0b3a66)} .pp-area ul{margin:2px 0 0;padding-left:15px}
.pp-equip{margin-top:6px;font-size:9.5pt} .pp-equip p{margin:0}
.land .pp-sheet.hasareas .pp-diag svg{max-height:2.65in} .port .pp-sheet.hasareas .pp-diag svg{max-height:3in}
.bw .pp-areas h4,.bw .pp-equip h4{color:#000}

.chk.gn{display:inline-flex;align-items:center;gap:6px}.chk.gn input[type=range]{width:84px}.chk.gn output{min-width:2.4em;font-variant-numeric:tabular-nums}

html,body{overscroll-behavior:none}#stageWrap{overscroll-behavior:contain;touch-action:none}#zScroll{white-space:nowrap}

/* practice templates dialog */
.tpl{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.tpl-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tpl-h b{font-size:15px}.tpl-p{margin:4px 0 8px;font-size:12.5px;line-height:1.4}
.tpl-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}.tpl-strip figure{margin:0;flex:0 0 auto;width:124px}
.tpl-th{background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px;line-height:0}.tpl-th svg{width:100%;height:auto;display:block}
.tpl-strip figcaption{font-size:11px;line-height:1.25;color:var(--muted);margin-top:3px;word-break:break-word}
.tpl-b{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* v8: age tag rows, drill feedback, tag tool, diagram editing */
.chip-break{flex-basis:100%;height:0}
.fbline{font-size:12px;margin-top:3px;line-height:1.3}.stars{color:#c77d00;letter-spacing:1px;font-weight:700}
.fb{margin:4px 0 8px}.fb-e{border-top:1px solid var(--line);padding:5px 0;font-size:12.5px}.fb-t{margin-top:2px;white-space:pre-wrap}
.starpick{display:flex;gap:4px;margin:4px 0}.starpick button{font-size:26px;line-height:1;background:none;border:0;cursor:pointer;color:#bbb;padding:0 2px}.starpick button.on{color:#e0a000}
.agerow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.td-list{border:1px solid var(--line);border-radius:8px;max-height:300px;overflow:auto;background:var(--panel)}
.td-row{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-bottom:1px solid var(--line);font-size:13px}.td-row:last-child{border-bottom:0}
.td-row .tags{margin-top:2px}
.deditbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff4d6;color:#4a3500;border-bottom:2px solid #e0a000;padding:6px 12px;font-size:13px}.deditbar[hidden]{display:none}
.deditbar b{font-size:14px}.deditbar .sp{flex:1}
body.dedit #bBackup,body.dedit #bReview,body.dedit #bOnIce,body.dedit #bNew,body.dedit #bOpen,body.dedit #bSave,body.dedit #bPrint,body.dedit #bExport,body.dedit #right,body.dedit #tabbar,body.dedit #bInfo,body.dedit #bLogo{pointer-events:none;opacity:.35}

/* v9: on-ice mode, backups, rotations, small screens */
#onice{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;color:var(--text)}
#onice .oi-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#onice .oi-h b{font-size:15px}#onice .oi-sp{flex:1}
#onice .oi-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;padding:12px 14px;overflow:auto}
#onice .oi-dia{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;align-self:start}#onice .oi-dia svg{width:100%;height:auto;display:block}
#onice .oi-txt{font-size:clamp(16px,1.9vw,24px);line-height:1.4}#onice h2{margin:0 0 4px;font-size:clamp(22px,3vw,34px)}#onice h4{margin:12px 0 2px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#onice .oi-txt ul{margin:2px 0 0 1.1em;padding:0}#onice .oi-time{font-variant-numeric:tabular-nums;font-size:clamp(30px,5vw,56px);font-weight:700;min-width:3.2em;text-align:center}#onice .oi-time.done{color:var(--danger)}
#onice .oi-f{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line)}

.rv-row{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 8px;background:var(--panel2)}.rv-row textarea{width:100%;margin-top:4px}

const U7A = ['6U', '8U'], U9A = ['10U'];
const HCU7 = n => { const p = String(n).padStart(2, '0'); return { short: 'Hockey Canada U7', text: 'Hockey Canada Skills Development Program: Under-7 Practice Plan ' + p, url: 'https://cdn.hockeycanada.ca/hockey-canada/Hockey-Programs/Coaching/u7-program/downloads/2020/u7-practice-plan-' + p + '-e.pdf' }; };

const hcRow = (b, x, y0, n, dy, col, role) => { for (let i = 0; i < n; i++) b.p(role || 'F', x, y0 + i * dy, col || RED); };
const hcRun = (b, x0, x1, y0, n, dy) => { hcRow(b, x0, y0, n, dy); for (let i = 0; i < n; i++) b.fwd([[x0 + 4, y0 + i * dy], [x1, y0 + i * dy]]); };
const hcNote = (b, x, y, s, w) => b.text(x, y, s, { w: w || 40, bg: 'white', align: 'center', size: 13, bold: true });
const hcScatter = (b, pts, col) => pts.forEach(p => b.p('F', p[0], p[1], col));

  { id: 'hc_pylonscrim', name: 'Pylon Target Scrimmage', ages: U7A, cat: 'Small-Area Games', cross: true, view: 'halfL', dur: 10, equip: '2 cones, several pucks', inspired: HCU7(5),

  { id: 'hc_garbage', name: 'Garbage Man', ages: U7A, cat: 'Small-Area Games', cross: true, view: 'halfL', dur: 8, equip: '15 to 25 pucks', inspired: HCU7(6),

  { id: 'hc_treasure', name: 'Steal the Treasure', ages: U7A, cat: 'Small-Area Games', cross: true, view: 'halfL', dur: 8, equip: 'A bucket or box, 20 pucks', inspired: HCU7(6),
    desc: 'Place a treasure chest (bucket or box) at one end and all the pucks (treasure) at the players’ end. Players pick up one puck, skate to the chest and drop it in. Coaches are pirates who try to tag them. A tagged player drops the puck and goes back for another. Gloves stay on.',

  { id: 'hc_sweep', name: 'Forehand Sweep Shot at the Boards', ages: U7A, cat: 'Shooting', cross: true, view: 'halfL', dur: 7, equip: 'Pucks, boards or a small net', inspired: HCU7(8),

  { id: 'hc_skatepuck', name: 'Skating with the Puck: Fill the Net', ages: U7A, cat: 'Puck Skills', cross: true, view: 'halfL', dur: 8, equip: 'A puck per player, 1 net', inspired: HCU7(8),

  { id: 'hc_bugs', name: 'A Bug’s Life', ages: U7A, cat: 'Small-Area Games', cross: true, view: 'halfL', dur: 8, equip: '10 to 15 pucks, 2 nets', inspired: HCU7(8),

    sec('Drawing tools', `<ul><li><b>Lines:</b> drag for a straight line. <b>Curved</b> (or the “Curved” box when another line tool is active) works with <b>waypoints</b>: click to drop each one and the curve flows through them automatically. Double-click, press <kbd>Enter</kbd> or click the last waypoint to finish; <kbd>Backspace</kbd> removes the last one. To edit a line, drag a waypoint, click on the line to add one, or click a waypoint and press <kbd>Delete</kbd> (or double-click it).</li><li><b>Skating:</b> forward is a solid arrow, backward is a dashed wave (broken into separate arcs), with-puck is a tight, shallow wave. <b>Pass</b> is dashed; <b>Shot</b> is a double line.</li><li><b>Line starts and ends:</b> in the properties bar, <i>Start</i> and <i>End</i> each offer None, Arrow, T-stop, Dot, <b>Pivot</b> and <b>Double bar</b>. A <b>Pivot</b> (two curved bars) marks where a skater changes between backward and forward skating. Its <i>Pivot</i> setting picks the direction: backward → forward, or forward → backward. Put it at the end of the first line, or at the start of the next one.</li><li><b>People:</b> pick a team color first, then F, D, G, LW, C, RW, Coach or a blank Marker. Double-click a player to change its label. <b>Name the groups</b> labels each color in the legend; the default player color shows as “Skater”.</li><li><b>Objects:</b> nets, pads (1×10 ft and 1×5 ft), cones, tires and pucks are drawn at real-world size. Nets keep real proportions; use the <i>Size</i> slider to enlarge a placed net for clarity. <b>Goal nets</b> (top bar, 1× to 3×) enlarges the two goal nets drawn on the rink, in prints and in pictures too. <b>Pad row…</b> lays a whole row of pads end to end along a blue line, the center line or a goal line, or along a line you drag. <b>Highlight small items</b> (top bar) enlarges cones, pucks, tires and pads so they show on a full rink.</li><li>You can also <b>drag</b> any tool from the left panel onto the ice.</li></ul>`) +
    sec('Selecting and editing', `<ul><li>Click to select; <kbd>Shift</kbd>-click or drag a box to select several. Drag to move.</li><li>Square handles resize, the round handle on top rotates (text boxes too, around their center). Pads resize by length.</li><li><b>Snapping:</b> straight lines snap to horizontal or vertical when they are nearly there, and rotation snaps to 0°, 90°, 180°, 270° and 45° steps. Hold <kbd>Alt</kbd> to draw or rotate freehand, or <kbd>Shift</kbd> for 45° line steps and 15° rotation steps. Curves through waypoints are never snapped.</li><li>The properties bar sets <b>color, opacity, thickness / size / font size, bold</b>, layer order, duplicate and delete. Double-click text to edit it.</li><li><b>Snap</b> and <b>Grid</b> (top bar) align things to a 5 ft grid.</li></ul>`) +
    sec('Zoom and pan', `<ul><li><b>Mac trackpad:</b> slide two fingers to <b>pan</b> and <b>pinch</b> to zoom toward the point between your fingers. Hold <kbd>Cmd</kbd> (or <kbd>Ctrl</kbd>) while scrolling to do the other one: zoom instead of pan.</li><li><b>Mouse wheel:</b> the <b>Scroll: Pan | Zoom</b> switch by the zoom bar sets what plain scrolling does. Pan is the default; set it to Zoom if you use a mouse wheel. <kbd>Shift</kbd>+scroll pans sideways. You can only pan once you are zoomed in.</li><li><b>Buttons and keys:</b> <b>− +</b> and <b>Fit</b> at the bottom right of the ice, and <kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd>. The arrow keys pan when nothing is selected.</li><li><b>Pan by dragging:</b> click <b>✋ Pan</b> and drag, or hold <kbd>Space</kbd> and drag, or use the middle mouse button. On a touch screen, drag with two fingers and pinch.</li><li>Zoom is only how you <i>look</i> at the ice: it is not saved, printed or exported. Switching sheets or layouts fits the ice to the window again.</li></ul>`) +
    sec('Sheets (practice segments)', `<ul><li><b>Notes by area of the ice:</b> in Sheet notes, split your notes into boxes for the left zone, neutral zone and right zone (or halves, quadrants, stations or lanes). In prints and pictures each area’s notes sit in matching columns under the diagram, in ice order, and areas with no notes are left out. A library drill dropped into an area adds its notes to that area’s box.</li><li>In <b>Sheet notes</b> set the title, <b>start time and minutes</b> (the end time is calculated), ice area, instructions, coaching points and equipment. A new sheet starts when the previous one ends.</li><li>The <b>Practice timeline</b> shows every sheet, the total length, and flags <b>gaps and overlaps</b>. “Re-time sheets back to back” fixes them.</li><li><b>Practice templates</b> (button at the top of the Drill library) loads a whole multi-sheet plan: <b>Start from this</b> replaces your plan, <b>Add after current sheet</b> inserts its sheets and chains the start times. <b>Save this plan as a template</b> keeps your own plans in the same list; export and import move them between computers. The built-in ones (6U, 8U, 10U, 12U) are my own example plans, not official USA Hockey plans.</li><li><b>Drag a tab</b> to reorder (or use ◀ ▶, which also works on touch screens). <b>Duplicate</b> copies a sheet; <b>Delete</b> asks first and can be undone.</li></ul>`) +
    sec('Layouts', `<ul><li>A layout <b>zooms</b> the sheet to an area and <b>draws</b> a boundary or shaded, labeled areas: half and quarter ice, cross-ice halves (with small nets), neutral zone (whole, or its top or bottom half with a dividing line from blue line to blue line through center ice), end zones, thirds, lanes, and 2–6 stations.</li><li><b>Clear layout boundaries</b> removes what a layout added. <b>Zoom only</b> changes the view without drawing anything.</li><li><b>Save this sheet as a layout</b> keeps your own setup for reuse.</li></ul>`) +
    sec('Drill library and orientation', `<ul><li>Filter by age (6U–18U), category and <b>cross-ice friendly</b>, or search. Click a drill to preview it.</li><li><b>Add to this sheet</b> keeps everything already on the sheet, adds the drill’s diagram on top and merges its notes. <b>Add as new sheet</b> makes a fresh sheet. <b>Replace this sheet</b> clears it first.</li><li><b>Place on</b> puts the drill in any ice area. <b>Orientation</b> rotates it: <i>Across ice</i> turns a lengthwise drill 90° so it runs <b>across the ice, parallel to the blue lines</b> (try Sharks &amp; Minnows). <b>Flip</b> mirrors it. <b>Keep proportions</b> avoids stretching to fit the area. The preview updates as you choose.</li><li>Drills adapted from published ideas carry an <b>Inspired by</b> credit with a link to where the idea came from.</li><li>Build your own: <b>Save this sheet as my drill</b>, edit any drill (built-in drills are copied first), and use <b>Import / Export</b> to share drills as a file.</li></ul>`) +
    sec('Team logo', `<ul><li><b>Team logo</b> places a picture at center ice behind your drawings on every sheet, in prints and in exports.</li><li>Size runs from 20% to <b>400%</b> (100% fills the center circle). Opacity and “crop to a circle” are also available.</li></ul>`) +
    sec('Saving, opening and backups', `<ul><li><b>Save</b> downloads a <kbd>.json</kbd> file named from the team and date, including all sheets and the logo. <b>Open</b> loads one.</li><li>A <b>●</b> on the Save button means unsaved changes, and the browser warns before you close the page.</li><li>A backup is also kept automatically in this browser. Clearing the browser’s site data deletes it, so save to a file regularly.</li></ul>`) +
    sec('Printing and exporting pictures', `<ul><li><b>Print:</b> an overview page (schedule, equipment) then <b>one page per sheet</b> with a large diagram, legend and instructions. Choose landscape or portrait, and a black-and-white option. Pick “Save as PDF” in the print window for a PDF.</li><li><b>Export image:</b> a <b>share page</b> with header, diagram, legend and description, or the diagram alone, per sheet or for the whole plan. Choose <b>Portrait</b> (tall, built for phone screens and letter pages) or <b>Landscape</b> (wide, for slides, tablets and TVs), and the picture width. Download it, copy it, or use <b>Share</b> where your device supports it.</li></ul>`) +
    sec('Keyboard shortcuts', `<table>${keys.map(k => `<tr><td><kbd>${k[0].replace(/ · /g, '</kbd> <kbd>')}</kbd></td><td>${k[1]}</td></tr>`).join('')}</table>`) +
    sec('Community library and marked drills', `<ul><li><b>Community library:</b> when this file opens and the computer is online, it checks the shared library on GitHub for new or improved drills and practice plans. They appear with a <b>Community</b> tag, and a drill with the same id as a built-in drill replaces it. The last copy is kept so the app still works offline. <b>Check for library updates</b> (top of the Drill library) checks right away.</li><li>Your own tags, edits, ratings and favorites stay on your computer, on top of whatever the shared library says.</li><li><b>Mark for deletion</b> flags a built-in drill so a future update can remove it. Nothing is removed from this app. Marked drills are dimmed; <b>Marked for deletion…</b> lists them with Copy and Download, <b>Hide marked drills</b> tucks them away, and Tag drills can mark many at once.</li></ul>`) +
    sec('Maintainer tools: publishing the community library', `<p>For the person who looks after the shared library on GitHub. This is a convenience switch, not a security lock: GitHub decides who can publish.</p><label class="opt"><input type="checkbox" id="maintToggle"${maintOn() ? ' checked' : ''}> Show maintainer tools</label><p>With it on, the Drill library has <b>Build app file…</b>, which writes a new copy of this app (a new .html you can email) with your drills, edits, retire list and practice plans built in, so they appear on any computer with no browser data needed. It also has a <b>Build library files…</b> button. It starts from the library loaded in this app, adds your own drills and practice plans, applies your edits and tags, retires the drills you marked for deletion, raises the version number, and downloads a matching <b>master.json</b> and <b>master.js</b>. Then on GitHub: open the repository, <b>Add file</b>, <b>Upload files</b>, drop both files in with those exact names, and commit. Coaches get the update the next time their copy opens online. Ratings and comments are never included.</p>`) +
    sec('Coaching tools: on-ice mode, review, rotations, backups', `<ul><li><b>On-ice</b> (top bar) is a full-screen coach view, one sheet at a time, with big text and a countdown timer. Arrow keys move between sheets, Space starts or pauses the timer, Esc exits. It asks the screen to stay awake where the browser allows it.</li><li><b>Review</b> lists every library drill used in the plan so you can rate them all at once after practice.</li><li><b>Rotation schedule…</b> (Sheet notes, when a sheet has station areas) works out which group is at which station each round and adds it to the instructions.</li><li><b>Back up</b> downloads one file with your plan, drills, tags, edits, feedback, templates and saved filters, restores from such a file, and shows an automatic history of your plan. The app reminds you now and then to back up.</li><li>The drill library also has <b>★ Favorites</b>, an ice-area filter, a group-size filter and <b>saved filters</b>. <b>Update drill from this sheet…</b> and <b>Refresh sheet from drill…</b> (Sheet notes) copy changes in either direction.</li></ul>`) +
    sec('Drill library: tags, edits and feedback', `<ul><li><b>Age tags:</b> a drill can carry any mix of 6U to 18U and the level names (LTP, Mite Dev., Mite, Squirt, PeeWee, Bantam, Midget, High School).</li><li><b>Tag drills…</b> (top of the library) adds, removes or replaces tags on many drills at once. Built-in drills are not copied.</li><li><b>Edit drill…</b> changes any drill in place: notes, equipment, minutes, category and tags. <b>Edit diagram…</b> opens the diagram in the main editor with a yellow bar; <b>Save to drill</b> keeps it and your practice plan comes back untouched. <b>Reset to original</b> restores a built-in drill’s own notes and diagram; <b>Make a copy…</b> saves a separate version under ★ Mine.</li><li><b>Feedback:</b> <b>Add feedback…</b> logs a dated 1–5 star rating and comment each time you try a drill. The card shows the average, the number of tries and the latest comment. Filter by rating or sort by best rated. A sheet you added from the library has <b>Rate this drill…</b> in Sheet notes. Ratings and comments are never printed or exported as pictures.</li><li>All of this is kept in this browser. Use <b>Export my drills</b> now and then to back it up; uncheck the ratings and your changes when you share the file.</li></ul>`) +
    sec('Good to know', `<ul><li>Everything runs in your browser: no internet needed and nothing is uploaded.</li><li>Players are symbols (about 3 ft across at size 1) so they stay readable; the rink, nets and pads are true scale.</li><li>Library drills are original examples organized by USA Hockey age categories. They are not official USA Hockey content. Drills credited “Inspired by Hockey Canada” are my own versions of activities from Hockey Canada’s free U7 and U9 practice plans (U7 drills are tagged 6U and 8U, U9 drills 10U). They are not official Hockey Canada content; the credit links to the plan each came from.</li><li>An “Inspired by” credit appears only in the drill library and the Sheet notes tab. It is never printed or exported.</li></ul>`),
    buttons: [{ label: 'Load the sample plan', onClick: () => { loadSample(); } }, { label: 'Close', primary: true }] });
}

/* ---- top bar + startup ---- */
$('#bNew').onclick = newPlan; $('#bOpen').onclick = openFileDialog; $('#bSave').onclick = saveFile; $('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bInfo').onclick = planInfoDialog; $('#bLogo').onclick = logoDialog; $('#bExport').onclick = exportDialog; $('#bPrint').onclick = printDialog; $('#bHelp').onclick = helpDialog;
$('#cSnap').onchange = e => { ui.snap = e.target.checked; }; $('#cGrid').onchange = e => { ui.grid = e.target.checked; renderGrid(); };
$('#cHL').onchange = e => { act(() => { S.info.hl = e.target.checked; }, null, { insp: false }); buildLeft(); renderLibList(); };
$('#rGoalNet').oninput = e => { const g = clamp(+e.target.value || 1, 1, 3); act(() => { S.info.goalNet = g; }, 'goalnet', { rink: true, insp: false }); syncGoalNet(); };
$('#bToggleL').onclick = () => { userPanels = true; const a = $('#app'); a.classList.toggle('noleft'); if (narrowMQ.matches && !a.classList.contains('noleft')) a.classList.add('noright'); setTimeout(renderOverlay, 50); }; $('#bToggleR').onclick = () => { userPanels = true; const a = $('#app'); a.classList.toggle('noright'); if (narrowMQ.matches && !a.classList.contains('noright')) a.classList.add('noleft'); setTimeout(renderOverlay, 50); };
$('#planTitle').addEventListener('input', e => act(() => { S.info.title = e.target.value; }, 'ptitle', { stage: false, insp: false }));
$('#planTeam').addEventListener('input', e => act(() => { S.info.team = e.target.value; }, 'pteam', { stage: false, insp: false }));
$('#planDate').addEventListener('input', e => act(() => { S.info.date = e.target.value; }, 'pdate', { stage: false, insp: false }));
window.addEventListener('beforeunload', e => { try { autosave(); } catch (_) { } if (ui.dirty) { e.preventDefault(); e.returnValue = ''; } });

function init() {
  installBaked(); migrateStores();
  $('#app').className = ''; autoPanels();
  buildLeft(); buildLibrary(); buildNotes(); setRT('lib');
  let restored = false;
  try { const raw = localStorage.getItem(LS.auto); if (raw) { loadData(JSON.parse(raw)); setSaveState('Restored your last session'); restored = true; } } catch (e) { }
  if (!restored) S = samplePlan();
  ui.lib.age = S.info.age || '10U'; buildLeft(); renderChips(); renderLibList(); setTool('select'); renderAll(); clearDirty();
}
init();

</script>
</body>
</html>
